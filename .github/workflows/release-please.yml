name: release-please

on:
  push:
    branches: [main]
  # Rebuild and re-attach the APK for an existing release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the APK for"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Opens/updates the release PR (version bump in package.json + app.json,
  # CHANGELOG.md) from conventional commits; merging it tags vX.Y.Z and
  # creates the GitHub Release.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          # A PAT (not GITHUB_TOKEN) so the release PR and tag trigger CI.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Build a signed release APK at the tag and attach it to the release.
  build-apk:
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      # Inlined into the JS bundle. Regtest unless the repo variable
      # SPARK_NETWORK (Settings > Variables) is set to MAINNET.
      EXPO_PUBLIC_SPARK_NETWORK: ${{ vars.SPARK_NETWORK || 'REGTEST' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      # Managed Expo workflow: android/ is generated, not committed.
      - run: npx expo prebuild --platform android --no-install
      - name: build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      # Expo's generated project signs release builds with a debug key;
      # replace that signature with the real release key.
      - name: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "corisco-android-app-${TAG}.apk" \
            android/app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "corisco-android-app-${TAG}.apk"
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: gh release upload "$TAG" "corisco-android-app-${TAG}.apk" --clobber
